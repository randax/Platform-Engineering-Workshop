# The Cloudbox Console at http://portal.cloudbox.k8s.test — the same URL on both
# substrates (scripts/versions.env:164, PORTAL_HOST_URL). YAML is not shell, so
# the hostname is written out literally here; keep the two in step.
# NodePort 30600 (portal.yaml:153) stays published as the fallback for when the
# /etc/hosts block is missing on the docker substrate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: portal
spec:
  ingressClassName: cilium
  rules:
    - host: portal.cloudbox.k8s.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 8080
