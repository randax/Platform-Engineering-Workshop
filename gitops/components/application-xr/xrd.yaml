# The golden-path platform API: an Application. One manifest in — a running,
# URL-addressable workload with its Postgres + bucket wired in — out. This is
# the headline self-service abstraction (PRD-0003), built ON TOP of the
# WorkshopDatabase XR from module 04 (composition-of-compositions).
#
# Crossplane v2 CompositeResourceDefinition — scope: Namespaced, NO claims
# (v2 XRs are created directly in namespaces). Mirrors the WorkshopDatabase
# XRD's shape/annotations exactly.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: applications.platform.cloudbox.io
spec:
  scope: Namespaced
  group: platform.cloudbox.io
  names:
    kind: Application
    plural: applications
    singular: application
    shortNames:
      - app
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            # The name is load-bearing HERE, not just in the API server: the
            # composed ksvc is named after the XR and its external host is
            # "<name>-<namespace>.kn.cloudbox.k8s.test" — name and namespace
            # share ONE DNS label (63 characters, RFC 1035). Crossplane honours
            # this restriction rather than dropping it: genCrdVersion takes
            # min(its own default, metadata.properties.name.maxLength) and
            # writes it into the generated CRD (crossplane internal/xcrd/crd.go,
            # `if old := s.Properties["metadata"]…MaxLength; old != nil && *old
            # < maxLength`). 40 is the same cap the Console enforces
            # (apps/portal/internal/kube/resources.go, dnsName), so kubectl and
            # the Console agree about what a name may be. The Console also
            # checks the name+namespace PAIR (ValidKnativeHost); a schema cannot
            # — it does not know the namespace — so 40 is the floor under it,
            # not the whole rule. See docs/HAZARDS.md.
            #
            # A CEL rule cannot rescue that either, and it fails twice over —
            # checked against the sources, so nobody spends an afternoon on it:
            #   1. Kubernetes exposes only apiVersion, kind, metadata.name and
            #      metadata.generateName to x-kubernetes-validations ("No other
            #      metadata properties are accessible", CRD docs). There is no
            #      self.metadata.namespace for a rule to read.
            #   2. Crossplane's generated CRD keeps XValidations only from the
            #      XRD's spec and status sub-schemas (internal/xcrd/crd.go,
            #      genCrdVersion: cSpec.XValidations / cStatus.XValidations).
            #      The root schema is BaseProps() plus our description, so a
            #      root-level rule never reaches the API server at all.
            # The pair is enforced in the Console and documented in lab 04.
            metadata:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 40
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: Container image for the workload (any registry the cluster can pull).
                replicas:
                  type: object
                  description: Autoscaling bounds for the Knative revision.
                  default: {}
                  properties:
                    min:
                      type: integer
                      description: Minimum replicas. 0 = scale-to-zero (the default).
                      minimum: 0
                      default: 0
                    max:
                      type: integer
                      description: Maximum replicas.
                      minimum: 1
                      default: 3
                env:
                  type: array
                  description: >-
                    RESERVED — not yet implemented. The Composition emits no patch for
                    this field, so values set here are silently ignored. Kept in the
                    schema so the v2 append lands without an API break; see
                    gitops/components/application-xr/VENDOR.md.
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                database:
                  type: boolean
                  description: >-
                    Provision a Postgres database (a WorkshopDatabase XR) and wire its
                    connection secret into the workload as DATABASE_URL.
                    v1 LIMITATION: this flag is not yet gated — a database is always
                    provisioned regardless of the value (function-patch-and-transform
                    cannot conditionally omit a composed resource). See VENDOR.md.
                  default: true
                bucket:
                  type: boolean
                  description: >-
                    Provision an S3 bucket in RustFS and wire its name into the workload
                    as S3_BUCKET.
                    v1 LIMITATION: not yet gated — a bucket is always provisioned
                    regardless of the value. See VENDOR.md.
                  default: true
