# Backstage at http://backstage.cloudbox.k8s.test (scripts/versions.env:166,
# BACKSTAGE_HOST_URL — literal here because YAML cannot expand a shell var).
# app.baseUrl, backend.baseUrl and backend.cors.origin move with this host —
# see backstage.yaml:125,129,135 — all three must agree with the host below,
# or the SPA loads and every API call is CORS-blocked.
# Backend: Service `backstage`, port 7007 (backstage.yaml:231-243).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage
spec:
  ingressClassName: cilium
  rules:
    - host: backstage.cloudbox.k8s.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
