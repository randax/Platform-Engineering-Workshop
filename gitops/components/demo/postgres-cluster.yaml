# A CloudNativePG PostgreSQL cluster, sized for a laptop.
# Copy to gitops/components/demo/postgres-cluster.yaml in your platform repo and push.
#
# CNPG picks its default (pre-pulled) postgres image when imageName is unset —
# leave it unset in this workshop so nothing downloads at runtime.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
spec:
  instances: 1            # HA needs 3 — try it at home, your laptop RAM pays here

  bootstrap:
    initdb:
      database: app
      owner: app
      # No secret specified: CNPG generates one named "app-db-app" for us.

  storage:
    size: 1Gi
    storageClass: local-path   # must exist — wave 0 installed this provisioner

  # Requests only for CPU — deliberately no cpu limit. A request is what the
  # scheduler packs against; a CPU *limit* is a CFS quota that throttles the
  # container even when the node has idle cores, and a throttled Postgres pays
  # in latency for capacity nobody else is using. (Ask us about the rehearsal
  # where 98% CPU pressure sat on top of 23% actual utilisation.)
  # Memory limits stay: memory can't be throttled, so the limit is the only
  # backstop against a runaway — the failure mode is an OOM kill, not a queue.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 64MB
