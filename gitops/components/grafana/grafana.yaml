---
# Grafana 13.1.3 — dashboards for the Victoria stack (observability rework,
# issue #57). Pre-wired with three provisioned datasources. Nothing is fetched at
# boot (offline rule): two are native VictoriaMetrics plugins BAKED into the
# image (#65, apps/grafana/Dockerfile), the third is a built-in type.
#   - VictoriaMetrics (native plugin, default) → MetricsQL/metrics
#   - VictoriaLogs    (native plugin)          → LogsQL/logs
#   - VictoriaTraces  (built-in Jaeger type)   → traces (see VENDOR.md caveat)
# Anonymous read (Viewer) is on — workshop-grade. NodePort 30030
# (service-nodeport.yaml), the canonical observability port freed when otel-lgtm
# was retired; the portal's deep-links point here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # VictoriaMetrics via its NATIVE Grafana datasource plugin (#65), baked
      # into the image (see apps/grafana/Dockerfile) — the MetricsQL query editor
      # instead of the Prometheus shim. Same uid, so nothing that references it
      # by uid breaks.
      - name: VictoriaMetrics
        uid: victoriametrics
        type: victoriametrics-metrics-datasource
        access: proxy
        url: http://victoria-metrics.observability.svc.cluster.local:8428
        isDefault: true
        jsonData:
          httpMethod: POST
      # VictoriaLogs via its NATIVE datasource plugin — full LogsQL + the
      # VictoriaLogs Explore UX, not the lossy Loki shim. The native plugin takes
      # the VLogs base URL and appends its own /select/logsql paths (so no
      # /select suffix here, unlike the old Loki datasource).
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs.observability.svc.cluster.local:9428
      # VictoriaTraces exposes a Jaeger-compatible query API, so we use the
      # built-in Jaeger datasource (offline rule: no plugin at boot) pointed at
      # its /select/jaeger base. Replaces otel-lgtm's Tempo. See VENDOR.md.
      - name: VictoriaTraces
        uid: victoriatraces
        type: jaeger
        access: proxy
        url: http://victoria-traces.observability.svc.cluster.local:10428/select/jaeger
        jsonData:
          # Render each trace as a topology graph, not just a waterfall — the
          # Jaeger datasource's built-in Node Graph tab (#65). For the capstone's
          # one upload this IS the service map: portal → uploader → broker →
          # resizer as connected nodes. No plugin, works offline.
          nodeGraph:
            enabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.1.3"
spec:
  replicas: 1
  # Single writable state (grafana.db on emptyDir), no HA needed for a lab.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        # 472 is the grafana image's built-in user/group.
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          # Custom image: stock Grafana 13.1.3 + the native VictoriaMetrics
          # datasource plugins baked in (apps/grafana/Dockerfile, #65).
          # The tag is rewritten by release-please in the release PR — keep the
          # annotations, and keep the base-image version OUT of the block.
          # x-release-please-start-version
          image: "ghcr.io/randax/cloudbox-grafana:v0.2.1"
          # x-release-please-end-version
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ ALL ]
            # Grafana only writes /var/lib/grafana and /tmp (both emptyDir).
            readOnlyRootFilesystem: true
          env:
            # Anonymous read access (Viewer) — the workshop Grafana is open by
            # design. The login form stays available so an admin (default
            # admin/admin, ephemeral lab) can still edit.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Load-bearing for module 09 step 5 AND every "open in Grafana"
            # deep-link the Console emits. The Viewer role does NOT carry the
            # `datasources:explore` RBAC action, so an anonymous visitor asking
            # for /explore is 302'd to `/?redirectTo=/explore…` — the Grafana
            # HOME page, with the carefully-built ?panes= payload thrown away.
            # Verified on 13.1.3: anonymous
            # GET /api/access-control/user/actions returned
            #   datasources.id:read, datasources:query, datasources:read
            # and no datasources:explore. `viewers_can_edit` adds exactly that
            # action; it does not add dashboards:write, so an anonymous visitor
            # still cannot save anything. (The heavier alternative is
            # GF_AUTH_ANONYMOUS_ORG_ROLE=Editor — more rights than the workshop
            # needs.)
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "true"
            # Offline rule: never phone home at boot.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            # No plugins fetched at boot — they're BAKED into the image (#65).
            - name: GF_INSTALL_PLUGINS
              value: ""
            # GF_INSTALL_PLUGINS="" is NOT enough on its own: Grafana also runs a
            # background "preinstall" of the drilldown apps whose IDs are compiled
            # into the binary (12.4.5 tried 4, 13.1.3 tries 6 — it added
            # elasticsearch + zipkin, which the image already bundles anyway).
            # Offline that is six doomed calls to grafana.com on every pod start,
            # and readOnlyRootFilesystem turns each into an ERROR log line
            # attendees then have to be told to ignore. Turn it off.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            # Load the baked-in native VictoriaMetrics plugins from here. NOT the
            # default /var/lib/grafana/plugins — the data emptyDir below mounts
            # over /var/lib/grafana and would shadow it.
            - name: GF_PATHS_PLUGINS
              value: /opt/grafana-plugins
          ports:
            - name: http
              containerPort: 3000
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        # Ephemeral on purpose: dashboards are provisioned, and grafana.db does
        # not need to survive a pod restart in a 4-hour workshop.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
