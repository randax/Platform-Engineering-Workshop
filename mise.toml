# =============================================================================
# CloudBox — JavaZone 2026: Cloud on Your Terms
#
# Tool pins for the workshop. Everything is pinned (principle 14) — versions
# verified 2026-08-11 (the pre-event pass) and re-verified 2026-08-16, when
# `helm` went to 4.2.x and the three `helm upgrade --install` call sites gained
# an explicit `--server-side=false` (docs/HAZARDS.md) — kept at 4.2.4.
# Keep in sync with scripts/versions.env when bumping.
#
#   mise install        # install all tools below
#   mise tasks ls       # list workshop tasks
# =============================================================================

# =============================================================================
# Environment
# =============================================================================
# One kubeconfig for the workshop, separate from whatever else you talk to.
#
# Attendees arrive with a dozen contexts in ~/.kube/config, and rehearsal 3
# proved what that costs: destroy-cluster.sh removes the workshop's entries,
# kubectl silently falls through to the NEXT entry in the same file, and
# lab/01-cluster/verify.sh graded a real 36-node corporate cluster
# ("want 2 Ready nodes, have 36/36"). scripts/context-guard.sh catches that and
# is staying — but a file that contains ONLY the CloudBox cluster means there is
# nothing to fall through TO, which is a fix rather than a catch.
#
# {{env.HOME}} is mise templating, not your shell: this file ships to 80 laptops
# and must not name anyone's home directory. The value is duplicated ONCE, as
# CLOUDBOX_KUBECONFIG in scripts/context-guard.sh (shell scripts cannot read
# mise templating); check-consistency.sh fails if the two ever disagree.
#
# This only applies inside this repo, and only if mise reaches your shell —
# `mise activate`, a mise shim, or `mise run`/`mise exec`. Without activation
# nothing here is set and everything lands in ~/.kube/config exactly as before;
# `./scripts/install.sh --check` tells you which of the two you are, and why it
# matters. See docs/HELPERS.md ("Which kubeconfig am I even looking at?").
[env]
KUBECONFIG = "{{env.HOME}}/.kube/cloudbox.conf"

[tools]
# Talos v1.13.8 — never 1.12.x (cni:none docker clusters hang, talos#12885)
"aqua:siderolabs/talos" = "1.13.8"
# kubectl matches the Kubernetes version Talos v1.13.8 ships
kubectl = "1.36.2"
helm = "4.2.4"
# kind — only for scripts/kind-fallback.sh
kind = "0.32.0"
# crane — mirrors pinned images (host arch for tag pins, full index for digest pins)
crane = "0.21.9"
# cilium CLI — lab 01 uses `cilium status` to inspect the CNI
"aqua:cilium/cilium-cli" = "0.19.7"
# jq — JSON plumbing in verify scripts and lab hints
jq = "1.8.2"
# shellcheck — pinned because CI used the runner's preinstalled copy (0.9.0)
# while maintainers had a newer brew one. "clean locally" then did not mean
# "green in CI": 0.9.0 flagged an SC2015 that 0.11.0 does not. Principle 14
# applies to the linters too.
shellcheck = "0.11.0"
# talos-box, the VM substrate. No REGISTRY backend publishes it (upstream
# #95/#96/#101), but the releases are goreleaser tarballs, which mise's github
# backend installs straight from the release — so the binary is pinned here like
# everything else instead of arriving via brew or a hand-fetched tarball. The
# `exe=` hint is required: the repo is talos-box, the binary is tbx.
#
# This installs the BINARY only. The VM substrate also needs the privileged
# helper daemon — `tbx system install` on macOS (it sudo-s itself), the systemd
# units on Linux — lab/00-setup covers it. Skip
# that step and `tbx doctor` fails, substrate-decide.sh picks docker, and the
# workshop runs identically on the fallback.
"github:randax/talos-box[exe=tbx]" = "0.2.0"
# node — only for the Slidev presentation
node = "24"

# =============================================================================
# Attendee flow (see scripts/README.md)
# =============================================================================

[tasks.setup]
description = "🧰 Install workshop tools (mise) and verify them"
run = "./scripts/dev-setup.sh"

[tasks.init]
description = "📦 Pre-pull all pinned images + start the local registry mirror (run at home!)"
run = "./scripts/cloudbox-init.sh"

[tasks.preflight]
description = "🩺 Pre-flight check: Docker, resources, tools, pre-pulled images"
run = "./scripts/install.sh --check"

[tasks."cluster:create"]
description = "🚀 Create the Talos-in-Docker cluster and install Cilium"
run = "./scripts/create-cluster.sh"

[tasks."cluster:destroy"]
description = "💥 Destroy the Talos cluster (keeps the image mirror)"
run = "./scripts/destroy-cluster.sh"

[tasks."cluster:fallback"]
description = "🛟 Fallback: kind cluster + Cilium (if Talos-in-Docker fails)"
run = "./scripts/kind-fallback.sh"

[tasks."gitops:bootstrap"]
description = "🔁 Install Gitea + ArgoCD into the cluster (module 2)"
run = "./scripts/bootstrap-gitops.sh"

[tasks."gitops:seed"]
description = "🌱 Push this repo to the in-cluster Gitea (push-to-create)"
run = "./scripts/seed-gitea.sh"

[tasks.status]
description = "📋 Show cluster, ArgoCD app and platform pod status"
run = [
  "echo '=== Nodes ==='",
  "kubectl get nodes -o wide",
  "echo '=== ArgoCD Applications ==='",
  "kubectl get applications -n argocd 2>/dev/null || echo 'ArgoCD not installed (run gitops:bootstrap)'",
  "echo '=== Platform pods ==='",
  "kubectl get pods -A",
]

# =============================================================================
# Presentation (Slidev)
# =============================================================================

[tasks."slides:dev"]
description = "🎤 Start Slidev presentation in development mode"
run = "cd slides && npm run dev"

[tasks."slides:build"]
description = "📦 Build Slidev presentation for production"
run = "cd slides && npm run build"

[tasks."slides:export"]
description = "📄 Export slides to PDF"
run = "cd slides && npm run export"

[tasks."slides:presenter"]
description = "🎯 Start presenter mode for workshop"
run = "cd slides && npm run dev -- --presenter"

# =============================================================================
# Utility
# =============================================================================

[tasks.upstream]
description = "🔭 Maintainer: check every pin against upstream (needs internet)"
run = "./scripts/check-upstream.sh"

[tasks.help]
description = "❓ Show all available tasks"
run = "mise tasks ls"
