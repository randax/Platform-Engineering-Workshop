# The developer experience: this is ALL a developer writes to get a database
# plus an S3 bucket. Copy to gitops/components/demo/my-database.yaml and push.
#
# Crossplane v2: this is a namespaced XR created directly — not a Claim.
apiVersion: platform.cloudbox.io/v1alpha1
kind: WorkshopDatabase
metadata:
  name: my-db
spec:
  # One knob — a T-shirt size. It bundles compute, storage and HA instances.
  size: small

  crossplane:
    # Pin this XR to the Composition revision it was created with.
    #
    # Crossplane's default is Automatic: every XR silently adopts the newest
    # revision the moment one appears. That is wrong for a database. Running
    # `catch-up.sh 8` after finishing module 04 force-pushes a newer
    # platform-api, the running Postgres jumps a major version in place, and
    # CNPG's upgrade Job dies on binaries the pinned image does not carry:
    #   check for "/controller/old/usr/lib/postgresql/16/bin/postgres" failed
    # The cluster is then stuck in "Upgrading Postgres major version" and
    # module 04's verify.sh goes red for a lab that had passed.
    #
    # Manual does not freeze the API: change `size` (or `version`) here and the
    # same revision recomposes as always. It only stops an unrequested
    # migration of someone's data, which is the platform-engineering lesson
    # anyway — you choose when your database moves.
    compositionUpdatePolicy: Manual
