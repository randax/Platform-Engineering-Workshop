# =============================================================================
# Image pre-pull gate — every ref in scripts/images.txt must exist upstream.
# Turns the "verified on <date>" comment into a running check (issue #10):
# weekly (catches upstream deletions/retags) and on any PR touching the list.
# =============================================================================
name: Image gate

on:
  pull_request:
    paths: ['scripts/images.txt', '.github/workflows/images-gate.yaml']
  schedule:
    - cron: "43 4 * * 1"   # weekly, Monday 04:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crane-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on the release-please PR: it bumps the first-party pins to a version
    # that only exists once that PR is merged (merging is what publishes the
    # images), so the gate cannot pass there. It runs again on the weekly
    # schedule, which is what actually verifies the new pins.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install crane (pinned via mise)
        run: |
          set -euo pipefail
          source scripts/versions.env
          curl -fsSL https://mise.run | MISE_VERSION="${MISE_VERSION}" sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/share/mise/shims" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/mise" trust && "${HOME}/.local/bin/mise" install crane

      - name: Every pinned image exists upstream
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r ref; do
            if ! manifest="$(crane manifest "${ref}" 2>/dev/null)"; then
              echo "::error::MISSING upstream: ${ref}"
              fail=$((fail + 1))
            elif [[ "${ref}" == *@sha256:* ]]; then
              echo "ok  ${ref} (digest pin — mirrored byte-for-byte)"
            # Tag pins are mirrored per-arch by cloudbox-init.sh (crane copy
            # --platform), which ERRORS on an index missing that platform — a
            # single-arch index pin would fail only on attendees' machines of
            # the other arch. Require both linux/amd64 and linux/arm64 in every
            # tag-pinned index. Bare (non-index) manifests pass: crane copies
            # them as-is regardless of --platform (e.g. the amd64-only
            # Backstage image, which Apple Silicon runs emulated by design).
            elif jq -e '
                if (.mediaType // "" | test("image.index|manifest.list")) then
                  ([.manifests[].platform | select(.os == "linux").architecture]
                   | (index("amd64") and index("arm64")))
                else true end' >/dev/null <<<"${manifest}"; then
              echo "ok  ${ref}"
            else
              echo "::error::tag pin lacks linux/amd64 or linux/arm64: ${ref} (cloudbox-init.sh --platform copy would fail on the missing arch)"
              fail=$((fail + 1))
            fi
          done < <(grep -vE '^\s*(#|\[|$)' scripts/images.txt)
          echo "---"
          echo "${fail} missing"
          exit "${fail}"
