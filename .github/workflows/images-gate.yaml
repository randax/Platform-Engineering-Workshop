# =============================================================================
# Image pre-pull gate — every ref in scripts/images.txt must exist upstream.
# Turns the "verified on <date>" comment into a running check (issue #10):
# weekly (catches upstream deletions/retags) and on any PR touching the list.
# =============================================================================
name: Image gate

on:
  pull_request:
    paths: ['scripts/images.txt', '.github/workflows/images-gate.yaml']
  schedule:
    - cron: "43 4 * * 1"   # weekly, Monday 04:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crane-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on the release-please PR: it bumps the first-party pins to a version
    # that only exists once that PR is merged (merging is what publishes the
    # images), so the gate cannot pass there. It runs again on the weekly
    # schedule, which is what actually verifies the new pins.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install crane (pinned via mise)
        run: |
          set -euo pipefail
          source scripts/versions.env
          curl -fsSL https://mise.run | MISE_VERSION="${MISE_VERSION}" sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/share/mise/shims" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/mise" trust && "${HOME}/.local/bin/mise" install crane

      - name: Every pinned image exists upstream
        run: |
          set -euo pipefail
          # TEMPORARY exception (issue #7): refs matching this glob only WARN
          # instead of failing the gate. cloudbox-{portal,uploader,resizer} are
          # published and public (crane-verified 2026-08-10) and are held to the
          # same standard as every other ref; cloudbox-grafana joined the build
          # matrix after apps-v0.1.0 was tagged, so it has never been published.
          # DELETE THE NEXT LINE once it is published and flipped public — with
          # the glob unset the gate fails for it like everything else.
          PENDING_GLOB='ghcr.io/randax/cloudbox-grafana:*'

          fail=0; warn=0
          while IFS= read -r ref; do
            if crane manifest "${ref}" >/dev/null 2>&1; then
              echo "ok  ${ref}"
            # shellcheck disable=SC2053  # unquoted RHS: glob match is intended
            elif [[ -n "${PENDING_GLOB:-}" && "${ref}" == ${PENDING_GLOB} ]]; then
              echo "::warning::PENDING (issue #7): ${ref}"
              warn=$((warn + 1))
            else
              echo "::error::MISSING upstream: ${ref}"
              fail=$((fail + 1))
            fi
          done < <(grep -vE '^\s*(#|\[|$)' scripts/images.txt)
          echo "---"
          echo "${fail} missing, ${warn} pending"
          exit "${fail}"
